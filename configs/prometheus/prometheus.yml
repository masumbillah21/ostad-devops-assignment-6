# Prometheus Configuration
# DevOps Batch 14 - Server Monitoring Assignment

global:
  scrape_interval: 15s     # How frequently to scrape targets by default
  evaluation_interval: 15s # How frequently to evaluate rules
  scrape_timeout: 10s      # Timeout before scrape attempt is cancelled

# Alertmanager configuration (optional / future extension)
alerting:
  alertmanagers: []

# Rule files (optional)
rule_files: []

# Scrape configurations
scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          environment: 'production'
          service: 'monitoring'

  # Scrape Node Exporter (System metrics: CPU, RAM, Disk, Network)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          environment: 'production'
          instance: 'ubuntu-vm'
          role: 'server'
